<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&icon_names=arrow_back_ios" />
    <link rel="stylesheet" href="../basestyle.css">
    <link rel="stylesheet" href="./style.css">
    <title>Create new account</title>
</head>
<body>
    <div class="background2"></div>
    <div class="background"></div>
    <header><a href="../../index.html"><span class="material-symbols-outlined">arrow_back_ios</span></a></header>

    <!-- Общий контейнер -->
    <div class="container">
        <h1>Create new account</h1>

        <!-- Контейнер для самой карточки -->
         <div class="loginContainer">
            <!-- Форма для регистрации -->
            <div class="left login">
                <form action="" id="newacc">
                    <label for="login">YOUR EMAIL</label>
                    <input type="text" name="login" id="login">

                    <label for="password">CREATE A PASSWORD</label>
                    <input type="password" name="password" id="password">

                    <label for="repeat">REPEAT YOUR PASSWORD</label>
                    <input type="password" name="repeat" id="repeat">

                    <div class="checkbox" id="checkbox">
                        <input type="checkbox" name="agecheck" id="agecheck" id="tos">
                        <label for="agecheck" >I am 13 years of age or older and agree to the terms of the VStore User Agreement and the VStore Privacy Policy</label>
                    </div>


                    <p id="error"></p>
                    <!-- Я не добавлял капчу потому что лень -->
                    <div class="buttons">
                        <input type="submit" value="CREATE ACCOUNT">
                    </div>


                </form>
            </div>
         </div>
    </div>


    <script>
        function redirect(where)
{
    window.location.assign(where);
}

let form = document.getElementById("newacc");
let passwd = document.getElementById("password");
let errorbox = document.getElementById("error") ;
let tos = document.getElementById("tos");

let checkbox = document.getElementById("checkbox");

form.addEventListener("submit", (event) => 
	{
		event.preventDefault();

        let pass1 = document.getElementById("password").value;
        let pass2 = document.getElementById("repeat").value;

        if (pass1 == pass2) 
        {
            if (tos.checked == false) 
            {
                errorbox.innerHTML = `Please confirm your age`;
                checkbox.classList.add("failure");
            }
            else
            {
                redirect("../loggedin/indexplus.html");
            }
            
        }
        else
        {
            errorbox.innerHTML = `Passwords don't match`;
            repeat.classList.add("failure");


        }

    }
)
    </script>
</body>
</html>
