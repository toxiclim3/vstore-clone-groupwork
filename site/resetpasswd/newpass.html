<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&icon_names=arrow_back_ios" />
    <link rel="stylesheet" href="../basestyle.css">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div class="background2"></div>
    <div class="background"></div>
    <header><a href="../../index.html"><span class="material-symbols-outlined">arrow_back_ios</span></a></header>

    <!-- Общий контейнер -->
    <div class="container">
        <h1>Check your mailbox</h1>

        <!-- Контейнер для самой карточки -->
         <div class="loginContainer">
            <!-- Форма для регистрации -->
            <div class="left login">
                <p>Enter your new password <br> <span class="gray">Password must be at least 8 characters long, with at least 1 number and at least 1 symbol</span></p>
                <form action="" id="newpass">
                    <label for="password">ENTER YOUR NEW PASSWORD</label>
                    <input type="text" name="password" id="password">

                    <label for="repeat">REPEAT YOUR PASSWORD</label>
                    <input type="password" name="repeat" id="repeat">

                    <p id="error"></p>
                    <div class="buttons">
                        <input type="submit" value="RESET PASSWORD">
                    </div>
                </form>
            </div>
         </div>
    </div>

    <script src="resetp3.js"></script>
</body>
</html>
